<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Slop Score</title>
    <meta
      name="description"
      content="Paste copy and get a deterministic 0-100 score with exact spans, rules, reasons, and suggestions."
    />
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: #1f2528;
        background: #f4f1e8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }

      button,
      textarea {
        font: inherit;
      }

      .shell {
        min-height: 100vh;
        padding: 24px;
      }

      .workspace {
        display: grid;
        grid-template-columns: minmax(320px, 0.95fr) minmax(360px, 1.05fr);
        gap: 16px;
        max-width: 1280px;
        margin: 0 auto;
      }

      .input-pane,
      .report-pane {
        min-height: calc(100vh - 48px);
      }

      .input-pane {
        display: grid;
        grid-template-rows: auto 1fr auto;
        gap: 14px;
      }

      .brand-row,
      .lead-row,
      .url-row,
      .toolbar,
      .grade-card,
      .finding > div {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .eyebrow {
        margin: 0 0 5px;
        color: #66706a;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: 38px;
        line-height: 1;
      }

      .score-pill {
        display: grid;
        place-items: center;
        width: 72px;
        height: 72px;
        border: 2px solid #1f2528;
        border-radius: 8px;
        background: #f8c85c;
        font-size: 28px;
        font-weight: 800;
      }

      .score-pill[data-band="clean"] {
        background: #7fc894;
      }

      .score-pill[data-band="heavy-slop"] {
        background: #ef7b64;
      }

      textarea {
        width: 100%;
        min-height: 420px;
        resize: vertical;
        padding: 16px;
        border: 2px solid #1f2528;
        border-radius: 8px;
        color: #1f2528;
        background: #fffdf7;
        line-height: 1.5;
      }

      input[type="email"],
      input[type="url"] {
        min-width: 0;
        flex: 1;
        border: 2px solid #1f2528;
        border-radius: 8px;
        padding: 10px 12px;
        color: #1f2528;
        background: #fffdf7;
      }

      .status-line {
        min-height: 20px;
        margin: -6px 0 0;
        color: #66706a;
        font-size: 13px;
        font-weight: 700;
      }

      .toolbar {
        flex-wrap: wrap;
      }

      .toggle {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: #38413d;
        font-weight: 700;
      }

      button {
        min-width: 88px;
        border: 2px solid #1f2528;
        border-radius: 8px;
        padding: 10px 14px;
        color: #1f2528;
        background: #fffdf7;
        font-weight: 800;
        cursor: pointer;
      }

      button:hover {
        background: #d8ebe0;
      }

      .report-pane {
        display: grid;
        align-content: start;
        gap: 14px;
      }

      .empty-state,
      .grade-card,
      .highlighted-copy,
      .finding {
        border: 2px solid #1f2528;
        border-radius: 8px;
        background: #fffdf7;
      }

      .empty-state {
        padding: 22px;
        color: #66706a;
      }

      .grade-card {
        padding: 18px;
      }

      .grade-card[data-band="clean"] {
        background: #d8ebe0;
      }

      .grade-card[data-band="some-tells"] {
        background: #fff0bf;
      }

      .grade-card[data-band="heavy-slop"] {
        background: #ffd9d2;
      }

      .grade {
        font-size: 58px;
        line-height: 0.9;
        font-weight: 900;
      }

      .band {
        margin: 0 0 5px;
        font-size: 22px;
        font-weight: 900;
      }

      .grade-card p {
        margin: 0;
      }

      .highlighted-copy {
        padding: 18px;
        white-space: pre-wrap;
        line-height: 1.65;
      }

      mark {
        border-radius: 4px;
        padding: 1px 3px;
      }

      mark[data-severity="fail"] {
        background: #ffb2a3;
      }

      mark[data-severity="warn"] {
        background: #ffe28a;
      }

      .findings {
        display: grid;
        gap: 10px;
      }

      .finding {
        padding: 14px;
      }

      .finding strong {
        overflow-wrap: anywhere;
      }

      .finding span {
        border: 1px solid #1f2528;
        border-radius: 999px;
        padding: 3px 8px;
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
      }

      .finding p {
        margin: 10px 0 0;
      }

      blockquote {
        margin: 10px 0 0;
        padding-left: 12px;
        border-left: 3px solid #1f2528;
        color: #4e5954;
      }

      @media (max-width: 860px) {
        .shell {
          padding: 14px;
        }

        .workspace {
          grid-template-columns: 1fr;
        }

        .input-pane,
        .report-pane {
          min-height: auto;
        }

        h1 {
          font-size: 32px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
